<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Player</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#08060c;
  overflow:hidden
}

#player{
  width:100%;
  height:100%;
  border:0;
  display:block
}
</style>
</head>

<body>

<iframe
  id="player"
  title="YouTube video"
  allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
  allowfullscreen
  referrerpolicy="strict-origin-when-cross-origin">
</iframe>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
(function(){
'use strict';

const APP_ORIGIN='https://tanjusevinc43-star.github.io';
const iframe=document.getElementById('player');

let player=null;
let queuedCommand=null;
let apiReady=false;
let loadStarted=false;

const params=new URLSearchParams(location.search);

/* YouTube video ID'sini güvenli şekilde al */
function getVideoId(){
  const raw=(params.get('videoId')||params.get('v')||'').trim();

  if(!raw)return '';

  try{
    const u=new URL(raw);

    if(u.hostname.includes('youtube.com')){
      return u.searchParams.get('v')||raw;
    }

    if(u.hostname==='youtu.be'){
      return u.pathname.slice(1)||raw;
    }
  }catch(e){}

  return raw;
}

const id=getVideoId();

const start=Math.max(
  0,
  Number(params.get('start')||0)
);

const autoplay=params.get('autoplay')==='1';

/* Durum bilgisini ana uygulamaya gönder */
function sendState(info){
  try{
    window.parent.postMessage(
      {
        event:'onStateChange',
        info:info
      },
      '*'
    );
  }catch(e){}
}

/* YouTube oynatıcıyı oluştur */
function load(){

  if(!id)return;

  /* API tamamen hazır değilse bekle */
  if(!apiReady)return;

  /* İkinci kez player oluşturulmasını engelle */
  if(loadStarted)return;

  loadStarted=true;

  player=new YT.Player('player',{

    width:'100%',
    height:'100%',
    videoId:id,

    playerVars:{
      autoplay:autoplay?1:0,
      controls:1,
      playsinline:1,
      rel:0,
      enablejsapi:1,
      origin:APP_ORIGIN,
      start:Math.floor(start)
    },

    events:{

      onReady:function(){

        try{

          if(start>0){
            player.seekTo(start,true);
          }

          if(autoplay){
            player.playVideo();
          }

        }catch(e){}

        /* Player hazır olmadan gelen komut varsa çalıştır */
        if(queuedCommand){

          const q=queuedCommand;

          queuedCommand=null;

          run(
            q.command,
            q.args
          );
        }
      },

      onStateChange:function(e){

        sendState(
          Number(e.data)
        );

      },

      onError:function(e){

        sendState(
          'error:'+String(e.data)
        );

      }

    }

  });
}


/* Player komutlarını çalıştır */
function run(command,args){

  if(
    !player ||
    typeof player.getPlayerState!=='function'
  ){

    queuedCommand={
      command:command,
      args:args||[]
    };

    return;
  }

  try{

    const a=args||[];

    if(command==='playVideo'){

      player.playVideo();

    }

    else if(command==='pauseVideo'){

      player.pauseVideo();

    }

    else if(command==='stopVideo'){

      player.stopVideo();

    }

    else if(command==='seekTo'){

      player.seekTo(
        Number(a[0]||0),
        a[1]!==false
      );

    }

    else if(command==='loadVideoById'){

      player.loadVideoById(
        a[0]
      );

    }

    else if(command==='cueVideoById'){

      player.cueVideoById(
        a[0]
      );

    }

  }catch(e){}

}


/* Ana uygulamadan gelen komutları dinle */
window.addEventListener(
  'message',
  function(e){

    const d=e.data;

    if(
      !d ||
      d.type!=='youtubeCommand'
    ){
      return;
    }

    /*
      Güvenlik:
      Sadece kendi uygulamamızdan gelen
      komutları kabul et.
    */
    if(
      e.origin!==APP_ORIGIN &&
      e.origin!=='null'
    ){
      return;
    }

    run(
      d.command,
      d.args||[]
    );

  }
);


/* YouTube API hazır olduğunda player oluştur */
window.onYouTubeIframeAPIReady=function(){

  apiReady=true;

  load();

};


/* API zaten yüklenmişse doğrudan başlat */
if(
  window.YT &&
  window.YT.Player
){

  apiReady=true;

  load();

}

})();
</script>

</body>
</html>
