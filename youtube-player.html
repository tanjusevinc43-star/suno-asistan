<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YouTube Player</title><style>html,body{margin:0;width:100%;height:100%;background:#08060c;overflow:hidden}#player{width:100%;height:100%}#fallback{display:none;color:#fff;font:600 14px system-ui;text-align:center;padding:24px}</style></head><body><div id="player"></div><div id="fallback">YouTube oynatıcı yüklenemedi.</div><script src="https://www.youtube.com/iframe_api"></script><script>const q=new URLSearchParams(location.search),id=q.get('id')||'',autoplay=q.get('autoplay')==='1',start=Math.max(0,Number(q.get('start')||0));let yt=null;function post(event,info){try{if(parent&&parent!==window)parent.postMessage({event,info},'*')}catch(e){}}function onYouTubeIframeAPIReady(){if(!id){document.getElementById('fallback').style.display='block';return}yt=new YT.Player('player',{videoId:id,width:'100%',height:'100%',playerVars:{autoplay:autoplay?1:0,controls:1,playsinline:1,rel:0,modestbranding:1,start:Math.floor(start)},events:{onReady:e=>{post('onReady',0);if(autoplay)e.target.playVideo()},onStateChange:e=>post('onStateChange',e.data),onError:e=>post('onError',e.data)}})}window.addEventListener('message',e=>{const d=typeof e.data==='string'?(()=>{try{return JSON.parse(e.data)}catch(_){return null}})():e.data;if(!d||d.event!=='command'||!yt)return;try{switch(d.func){case'playVideo':yt.playVideo();break;case'pauseVideo':yt.pauseVideo();break;case'seekTo':yt.seekTo(Number(d.args?.[0]||0),true);break;case'setVolume':yt.setVolume(Number(d.args?.[0]||100));break}}catch(_){}});setInterval(()=>{if(yt){try{post('syncTime',yt.getCurrentTime())}catch(_){}}},1000);</script></body></html>
