<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Player</title>

<style>
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #08060c;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #08060c;
}

#player {
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
}

#fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    color: #ffffff;
    text-align: center;
    background: #08060c;
}

#fallback .icon {
    font-size: 52px;
    margin-bottom: 14px;
}

#fallback .title {
    font-size: 18px;
    font-weight: 700;
}

#fallback .text {
    margin-top: 8px;
    font-size: 14px;
    opacity: .65;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}
</style>
</head>

<body>

<div id="app">

    <iframe
        id="player"
        allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
        allowfullscreen>
    </iframe>

    <div id="fallback">
        <div class="icon">▶️</div>
        <div class="title">YouTube oynatıcı hazır</div>
        <div class="text">Bir video seçildiğinde burada oynatılacak.</div>
    </div>

</div>

<script>
(function () {

    "use strict";

    const iframe = document.getElementById("player");
    const fallback = document.getElementById("fallback");

    let videoId = "";
    let currentStart = 0;

    function cleanVideoId(value) {

        if (!value) return "";

        let text = String(value).trim();

        try {
            if (text.includes("youtube.com") || text.includes("youtu.be")) {

                const url = new URL(text);

                if (url.hostname.includes("youtu.be")) {
                    return url.pathname.replace("/", "").split("/")[0];
                }

                if (url.searchParams.get("v")) {
                    return url.searchParams.get("v");
                }

                const parts = url.pathname.split("/");

                const embedIndex = parts.indexOf("embed");

                if (embedIndex !== -1 && parts[embedIndex + 1]) {
                    return parts[embedIndex + 1];
                }

                const shortsIndex = parts.indexOf("shorts");

                if (shortsIndex !== -1 && parts[shortsIndex + 1]) {
                    return parts[shortsIndex + 1];
                }
            }
        } catch (e) {}

        text = text
            .replace(/^.*[?&]v=/, "")
            .replace(/^.*youtu\.be\//, "")
            .replace(/^.*\/embed\//, "")
            .split("&")[0]
            .split("?")[0]
            .split("#")[0]
            .trim();

        return text;
    }

    function showPlayer(id, start) {

        const cleanId = cleanVideoId(id);

        if (!cleanId) {
            fallback.style.display = "flex";
            iframe.style.display = "none";
            return;
        }

        videoId = cleanId;
        currentStart = Number(start || 0);

        const origin = encodeURIComponent(window.location.origin);

        let src =
            "https://www.youtube.com/embed/" +
            encodeURIComponent(videoId) +
            "?autoplay=1" +
            "&rel=0" +
            "&playsinline=1" +
            "&enablejsapi=1" +
            "&origin=" + origin;

        if (currentStart > 0) {
            src += "&start=" + Math.floor(currentStart);
        }

        iframe.src = src;

        fallback.style.display = "none";
        iframe.style.display = "block";
    }

    function postToYouTube(command, args) {

        if (!iframe.contentWindow) return;

        iframe.contentWindow.postMessage(
            JSON.stringify({
                event: "command",
                func: command,
                args: args || []
            }),
            "https://www.youtube.com"
        );
    }

    window.addEventListener("message", function (event) {

        let data = event.data;

        if (!data) return;

        if (typeof data === "string") {
            try {
                data = JSON.parse(data);
            } catch (e) {
                return;
            }
        }

        if (!data || typeof data !== "object") return;

        /*
         * Mevcut Suno Asistan yapısıyla uyumlu:
         * {
         *   type: "cueVideo",
         *   videoId: "...",
         *   start: 0
         * }
         */

        if (data.type === "cueVideo") {

            const id = cleanVideoId(
                data.videoId ||
                data.url ||
                data.src ||
                data.id
            );

            if (id) {
                showPlayer(
                    id,
                    Number(data.start || data.startSeconds || 0)
                );
            }

            return;
        }

        if (data.type === "playVideo") {
            postToYouTube("playVideo");
            return;
        }

        if (data.type === "pauseVideo") {
            postToYouTube("pauseVideo");
            return;
        }

        if (data.type === "stopVideo") {
            postToYouTube("stopVideo");
            return;
        }

        if (data.type === "seekTo") {

            postToYouTube(
                "seekTo",
                [
                    Number(data.seconds || 0),
                    true
                ]
            );

            return;
        }

        if (data.type === "loadVideo") {

            const id = cleanVideoId(
                data.videoId ||
                data.url ||
                data.id
            );

            if (id) {
                showPlayer(
                    id,
                    Number(data.start || 0)
                );
            }

            return;
        }

        if (data.type === "setVideo") {

            const id = cleanVideoId(
                data.videoId ||
                data.url ||
                data.id
            );

            if (id) {
                showPlayer(
                    id,
                    Number(data.start || 0)
                );
            }

            return;
        }

    });

    /*
     * URL üzerinden doğrudan test edebilmek için:
     *
     * youtube-player.html?v=VIDEO_ID
     */

    try {

        const params = new URLSearchParams(
            window.location.search
        );

        const initialId =
            params.get("v") ||
            params.get("videoId") ||
            params.get("id");

        const initialStart =
            Number(params.get("start") || 0);

        if (initialId) {
            showPlayer(initialId, initialStart);
        }

    } catch (e) {}

})();
</script>

</body>
</html>
